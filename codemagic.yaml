workflows:
  polica-ios-testflight:
    name: Polica iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic Polica

    environment:
      node: latest
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.polica.app

    scripts:
      - name: Install dependencies
        script: |
          cd polica
          npm ci

      - name: Sync Capacitor iOS
        script: |
          cd polica
          npx cap sync ios

      - name: Set up iOS code signing
        script: |
          cd polica/ios/App
          xcode-project use-profiles

      - name: Set build number
        script: |
          cd polica/ios/App
          agvtool new-version -all $BUILD_NUMBER

      - name: Build signed IPA
        script: |
          cd polica/ios/App
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "App"

    artifacts:
      - polica/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
