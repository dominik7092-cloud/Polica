workflows:
  polica-ios-test:
    name: Polica iOS Test Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: latest
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          cd polica
          npm install

      - name: Create iOS project
        script: |
          cd polica
          if [ ! -d "ios" ]; then
            npx cap add ios --packagemanager SPM
          fi

      - name: Sync Capacitor
        script: |
          cd polica
          npx cap sync ios

      - name: Build Polica for iPhone Simulator
        script: |
          cd polica/ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log